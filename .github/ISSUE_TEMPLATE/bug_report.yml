name: "🐛 Bug Report / Bug 报告"
description: |
  Report errors or unexpected behavior.
  报告错误或异常行为。
labels:
  - bug
body:
  - type: checkboxes
    attributes:
      label: Self Checks / 自检
      options:
        - label: |
            I have read the [FAQ](https://github.com/zhangzhiwei-zzw/cc-switch-headless/blob/main/docs/web-mode-zh.md#常见问题) section in README.
            我已阅读 README 中的[常见问题](https://github.com/zhangzhiwei-zzw/cc-switch-headless/blob/main/docs/web-mode-zh.md#常见问题)。
          required: true
        - label: |
            I have searched for [existing issues](https://github.com/zhangzhiwei-zzw/cc-switch-headless/issues), including closed ones.
            我已搜索过[已有的 Issue](https://github.com/zhangzhiwei-zzw/cc-switch-headless/issues)，包括已关闭的。
          required: true

  - type: textarea
    attributes:
      label: Human Note / 本人说明
      description: |
        In your own words, say what you want to do. No AI-generated text.
        用你自己的话说清楚你想要做什么，不允许 AI 生成。
    validations:
      required: true

  - type: input
    attributes:
      label: CC Switch Version / 版本号
      description: |
        See Settings → About in the app.
        在应用的「设置 → 关于」中查看版本号。
      placeholder: "e.g. 4.0.4"
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Operating System / 操作系统
      multiple: false
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Related App / 涉及应用
      description: |
        Which app is affected?
        涉及哪个应用？
      multiple: true
      options:
        - Claude Code
        - Claude Desktop
        - Codex
        - Gemini CLI
        - Grok Build
        - OpenCode
        - OpenClaw
        - Hermes
        - Pi
        - MiniMax Code
        - Other / 其他
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce / 重现步骤
      description: |
        Please describe the steps to reproduce the bug. Screenshots and logs are helpful.
        请描述重现步骤。截图和日志会很有帮助。
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Behavior / 期望行为
      description: |
        What did you expect to happen?
        你期望发生什么？
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual Behavior / 实际行为
      description: |
        What actually happened?
        实际发生了什么？
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional Context / 补充信息
      description: |
        Any other information, screenshots, or logs.
        其他信息、截图或日志。
    validations:
      required: false

  - type: dropdown
    id: web-deployment
    attributes:
      label: Web deployment / Web 部署方式
      options:
        - Native binary / 原生二进制
        - systemd user service / systemd 用户服务
        - Docker
        - Source build / 源码构建
        - Desktop-only upstream issue / 上游桌面版问题
    validations:
      required: true

  - type: textarea
    id: web-diagnostics
    attributes:
      label: Web diagnostics / Web 诊断
      description: |
        Include the About page build commit, server OS, browser version and whether SSH forwarding or HTTPS proxy is used.
        请附上关于页的构建提交、服务端系统、浏览器版本，以及是否使用 SSH 隧道或 HTTPS 反代。
        Redact API keys, tokens, auth URLs and private session content. 不要粘贴密钥、访问令牌、登录链接或私人会话内容。
    validations:
      required: false
