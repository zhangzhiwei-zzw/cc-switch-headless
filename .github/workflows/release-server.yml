# 给 cc-switch-server 出预编译产物，挂到对应的 GitHub Release 上。
#
# 为什么不直接 `cargo build --release` 了事：这个 fork 存在的理由就是老系统
# （Ubuntu 20.04，glibc 2.31）跑不了桌面版，产物必须在 **老 glibc** 上编。
# GitHub 已经没有 20.04 的 runner 了，所以编译放在 ubuntu:20.04 容器里做
# ——复用仓库自带的 Dockerfile，构建环境与本地 `docker build` 完全一致。
#
# 产物名与安装脚本 scripts/install-server.sh 的约定一致：
#   cc-switch-server-linux-<arch>          可执行文件
#   cc-switch-server-linux-<arch>.sha256   校验和
#
# 与上游那份 release.yml（打桌面版安装包）互不干扰：两个 workflow 都往同一个
# tag 的 Release 里加资产。
name: Release server

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要附加产物的已有 tag（留空则只构建、不发 Release）"
        required: false
        type: string

permissions:
  contents: write
  # publish job 用 actions/download-artifact 读本 run 的产物；写死 permissions 后
  # 没列出的 scope 一律是 none，所以这里显式给 actions: read。
  actions: read

env:
  # 产物必须能在 Ubuntu 20.04 上跑——超过这个版本就在构建阶段失败，
  # 而不是等用户下回去才发现「找不到 GLIBC_2.3x」。
  MAX_GLIBC: "2.31"

jobs:
  build:
    name: build linux/${{ matrix.arch }}
    # 每个架构在自己的原生 runner 上构建，不走 QEMU（模拟下 Rust 全量编译是小时级）。
    # glibc 底线仍然由容器保证：ubuntu:20.04 有 arm64 镜像，产物照样是 2.31。
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-22.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          load: true
          tags: cc-switch-server:ci
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}

      - name: Extract the binary
        run: |
          set -euo pipefail
          container=$(docker create --platform ${{ matrix.platform }} cc-switch-server:ci)
          docker cp "$container:/usr/local/bin/cc-switch-server" cc-switch-server
          docker rm "$container"
          chmod +x cc-switch-server
          strip cc-switch-server || true
          ls -lh cc-switch-server

      # 产物能跑起来才算数：`--help` 证明动态链接没问题，起一次服务打
      # /api/capabilities 证明它真的能工作。用临时 HOME，不碰 runner 上的真实配置；
      # 这条腿在哪台 runner 上跑，就验证哪个架构的产物（aarch64 是在 ARM runner 上跑的）。
      - name: Smoke test the binary
        run: |
          set -euo pipefail
          ./cc-switch-server --help >/dev/null
          tmp=$(mktemp -d)
          HOME="$tmp" ./cc-switch-server --port 15999 >"$tmp/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            [ -f "$tmp/.cc-switch/web-token" ] && break
            sleep 0.5
          done
          token=$(cat "$tmp/.cc-switch/web-token")
          code=""
          for _ in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Cookie: ccswitch_web_token=$token" \
              http://127.0.0.1:15999/api/capabilities || true)
            [ "$code" = "200" ] && break
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "::error::/api/capabilities 返回 $code（期望 200）"
            cat "$tmp/server.log"
            exit 1
          fi
          echo "✅ 二进制可执行，/api/capabilities 返回 200"

      - name: Assert the glibc floor
        run: |
          set -euo pipefail
          python3 - "${{ env.MAX_GLIBC }}" <<'PY'
          import re, subprocess, sys
          limit = tuple(int(p) for p in sys.argv[1].split("."))
          out = subprocess.run(["objdump", "-T", "cc-switch-server"],
                               capture_output=True, text=True, check=True).stdout
          needed = sorted({tuple(int(p) for p in v.split("."))
                           for v in re.findall(r"GLIBC_(\d+\.\d+)", out)})
          if not needed:
              print("没有读到任何 glibc 版本引用，检查一下 objdump 输出")
              sys.exit(1)
          worst = needed[-1]
          print(f"最高需要 glibc {'.'.join(map(str, worst))}（上限 {sys.argv[1]}）")
          if worst > limit:
              print(f"::error::产物需要 glibc {'.'.join(map(str, worst))}，"
                    f"超出 {sys.argv[1]}，老系统装不上")
              sys.exit(1)
          PY
          # 动态依赖也顺带列出来：出现 libssl/libcrypto 说明又链回 OpenSSL 了
          echo "--- ldd ---"
          ldd cc-switch-server || true

      - name: Reject an OpenSSL dependency
        run: |
          set -euo pipefail
          if ldd cc-switch-server | grep -qE 'libssl|libcrypto'; then
            echo "::error::产物动态链接了 OpenSSL：不同发行版的 libssl 主版本不同"
            echo "（20.04 是 1.1.1、22.04+ 是 3.x），这样的包跨版本装不上。"
            echo "检查 reqwest 的 default-features 是否又被打开了。"
            exit 1
          fi

      - name: Package
        run: |
          set -euo pipefail
          name="cc-switch-server-linux-${{ matrix.arch }}"
          mv cc-switch-server "$name"
          sha256sum "$name" > "$name.sha256"
          cat "$name.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: cc-switch-server-linux-${{ matrix.arch }}
          path: |
            cc-switch-server-linux-${{ matrix.arch }}
            cc-switch-server-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error

  # Windows 不能在 Linux 容器里编（MSVC 工具链 + Windows 头文件都在 Windows 上），
  # 所以单独一条腿，直接用普通 cargo build，不套 Docker。
  build-windows:
    name: build windows/x86_64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 不能直接 `pnpm build:web`：那条脚本是 `CC_SWITCH_WEB=1 vite build …`，
      # POSIX 的「前缀式环境变量」在 PowerShell 下不是合法命令。改成由 workflow
      # 设置环境变量、直接调 vite，参数与脚本保持一致。
      - name: Build web frontend (server assets)
        env:
          CC_SWITCH_WEB: "1"
        run: pnpm exec vite build --outDir ../dist-web

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-server-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-server-

      - name: Build the server
        run: cargo build --release --no-default-features --features server --bin cc-switch-server --manifest-path src-tauri/Cargo.toml

      # 只做 --help：证明 PE 能加载、依赖齐全。不做起服务那套——在 Windows 上
      # HOME 不隔离配置目录（走 USERPROFILE），会把 runner 的真实用户目录写脏。
      - name: Smoke test the binary
        shell: pwsh
        run: |
          & "src-tauri/target/release/cc-switch-server.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "--help 退出码 $LASTEXITCODE" }
          Write-Host "✅ 二进制可执行"

      - name: Package
        shell: pwsh
        run: |
          $name = "cc-switch-server-windows-x86_64"
          Copy-Item "src-tauri/target/release/cc-switch-server.exe" "$name.exe"
          $hash = (Get-FileHash "$name.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.exe" | Out-File -Encoding ascii "$name.exe.sha256"
          Get-Content "$name.exe.sha256"
          Get-Item "$name.exe" | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: cc-switch-server-windows-x86_64
          path: |
            cc-switch-server-windows-x86_64.exe
            cc-switch-server-windows-x86_64.exe.sha256
          if-no-files-found: error

  publish:
    name: attach to release
    needs: [build, build-windows]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    steps:
      # 必须带 pattern：同一个 run 里除了服务端产物，还有 buildx 用
      # `cache-to: type=gha` 注册的缓存 artifact（`<owner>~<repo>~<hash>.dockerbuild`）。
      # 不带 pattern 时 download-artifact 会「下载全部」，那个缓存不是普通压缩包，
      # 解压失败会让整个步骤报 "failed after 5 retries"——哪怕真正的二进制已经下载好了。
      - uses: actions/download-artifact@v8
        with:
          pattern: cc-switch-server-*
          path: assets
          merge-multiple: true

      - name: List assets
        run: ls -lh assets

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: assets/*
          fail_on_unmatched_files: true
