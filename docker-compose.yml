# CC Switch Web 模式的最小部署示例。
#
#   docker compose up -d
#   docker compose logs | grep token        # 取首次访问的令牌
#   浏览器打开 http://127.0.0.1:15800/auth?token=<令牌>
#
services:
  cc-switch-web:
    build: .
    image: cc-switch-web
    container_name: cc-switch-web
    restart: unless-stopped
    # 只映射到宿主机回环：远程访问走 SSH 端口转发，不要把端口暴露到局域网
    ports:
      - "127.0.0.1:15800:15800"
    volumes:
      # 数据库、令牌、备份、导出都在这里
      - cc-switch-data:/data
      # 需要管理宿主机上的 CLI 配置时，把它们挂进来——
      # 容器里看到的路径就是它实际管理的路径
      # - ~/.claude:/data/.claude
      # - ~/.claude.json:/data/.claude.json
      # - ~/.codex:/data/.codex
      # - ~/.gemini:/data/.gemini
      # - ~/.grok:/data/.grok
    # ── 常用环境变量 ──
    # environment:
    #   CC_SWITCH_CONFIG_DIR: /data/.cc-switch     # 覆盖配置目录
    #   CC_SWITCH_WEB_TOKEN: <自定义令牌>           # 不设则自动生成
    #   CC_SWITCH_ALLOW_HOSTS: cc-switch.lan       # 用域名访问时追加白名单
    #   RUST_LOG: info

volumes:
  cc-switch-data:
